<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Underwater · Croba Planet</title>
<style>*{box-sizing:border-box}body{margin:0;background:#071e2d;color:#ebf5f8;font:16px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh}header,footer{position:fixed;z-index:2;left:0;right:0;padding:20px 24px}header{top:0;background:linear-gradient(#061523ed,transparent)}footer{bottom:0;background:linear-gradient(transparent,#061523e8);pointer-events:none}h1{font-size:24px;margin:0 0 8px}p{margin:5px 0;color:#b8d0da}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button,a{font:inherit;border:1px solid #7b9ba8;color:#e9f5f9;background:#102d3fdf;padding:10px 14px;border-radius:8px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #f5c28b;outline-offset:3px}#error{color:#ffb7a7}@media(max-width:600px){header,footer{padding:14px}h1{font-size:21px}button,a{padding:9px 11px;font-size:14px}}</style></head>
<body><header><h1>CROBA PLANET · World details</h1><p id="view-name">Preparing the seabed…</p><div class="controls"><button id="next">Next viewpoint</button><button id="animate" aria-pressed="false">Animate</button><button id="climb" hidden>Try climbing</button><a href="./">Play Croba</a></div></header><canvas id="world" aria-label="Actual terrain and moss in Croba Planet"></canvas><footer><p id="status" role="status">Loading underwater surfaces…</p><p>Actual game terrain and materials. Starts paused; animation pauses when hidden.</p><p id="error" role="alert"></p></footer>
<script type="module">
import {Scene} from './scene.js';
import {createWorld,updateWorld,SURFACE_FEET} from './world.js';
import {getOrangeCliffRoutes,getOrangeCliffSurface} from './orange-cliff-surface.js';
import {getSeabedHeight} from './seabed.js';
import {WATER_LEVEL,EYE_HEIGHT} from './terrain.js';
import {SPIRES_SUBMARINE_PREVIEWS} from './jelly-spires-submarine.js';
import {PREPARED_SPIRES_MARINE_GROWTH} from './prepared-spires-marine-growth-data.js';
import {getForestHeight} from './forest-terrain.js';
const moss=PREPARED_SPIRES_MARINE_GROWTH.find(site=>site.id==='submarine-moss-1626');
const route=getOrangeCliffRoutes().find(route=>route.region==='main')??getOrangeCliffRoutes()[0];
const cliffViews=[];
if(route){
  const length=Math.hypot(route.foot.x-route.lookout.x,route.foot.y-route.lookout.y)||1;
  const nx=(route.foot.x-route.lookout.x)/length,ny=(route.foot.y-route.lookout.y)/length;
  const x=route.foot.x+nx*650-ny*180,y=route.foot.y+ny*650+nx*180;
  const mid=route.path[Math.floor(route.path.length/2)];
  cliffViews.push(
    {id:'border',name:'Orange cliffs · jagged climbing ledges',x,y,z:Math.max(route.foot.z+90,(getOrangeCliffSurface(x,y)?.z??-Infinity)+90),target:mid,cliff:true},
    {id:'border-climb',name:'Orange cliffs · lower climbing ledges',...mid,target:route.summit,cliff:true},
    {id:'border-lookout',name:'Orange cliffs · lower lookout beneath the sheer rim',...route.lookout,target:route.summit,cliff:true});
}
const views=[
  {id:'starter',name:'Crash glacier · polar daylight',x:-5505,y:-1120,z:16,surface:true,target:{x:-5650,y:-850,z:35}},
  {id:'caustics',name:'Seabed · swirling sunlight',x:850,y:600,z:-257.922659874,target:{x:725,y:600,z:-272.610902786}},
  {id:'caustics-clear',name:'Open sand · continuous light patterns',x:-6250,y:-7000,z:-266,target:{x:-6250,y:-7125,z:-280}},
  {id:'shallows',name:'Arctic shallows',x:1000,y:600,lift:16,yaw:-.45,pitch:-.30},
  {id:'rocks',name:'Arctic seabed · uneven boulders',x:940,y:-60,lift:12,target:{x:758.794709,y:-254.660037,z:-240}},
  {id:'cliff',name:'Cliff Biome · sandy fissure',x:190,y:-15,lift:5,yaw:3.14,pitch:-.07},
  {id:'kelp',name:'Blue Kelp Forest · ravine',x:-4300,y:-4180,lift:9,yaw:2.49,pitch:-.08},
  {id:'deep',name:'Blue Ocean · deep gravel',x:5800,y:-2000,lift:8,yaw:.9,pitch:-.23},
  ...cliffViews,
  {id:'border-underwater',name:'Orange cliffs · submerged face',x:5000,y:-11130,z:-740,target:{x:5025,y:-11300,z:-640}},
  {id:'moss',name:'Crobon moss · flooded submarine',...SPIRES_SUBMARINE_PREVIEWS.find(view=>view.id==='submarine-inside').player,target:moss},
  {id:'moss-close',name:'Crobon moss · surface close-up',x:13977.88896743281,y:-6078.943357026731,z:-3597.4680546919813,target:moss},
  {id:'forest',name:'Violet Spruce Forest · mossy rock',x:3551.421,y:1643.92,forest:true,target:{x:3551.421,y:1698.92,z:146.8}},
];
let scene,world,time=0,frame=0,last=0,animating=false,hike=null,hikeMessage='';
const requestedView=new URLSearchParams(location.search).get('view');
let index=Math.max(0,views.findIndex(v=>v.id===(requestedView==='border-crest'?'border-lookout':requestedView)));
const status=document.querySelector('#status'),button=document.querySelector('#animate');
function draw(dt=0){
  scene.draw(world,time,dt,false);
  const depth=(WATER_LEVEL-world.player.z-EYE_HEIGHT)/25;
  status.textContent=hikeMessage||`${depth>0?depth.toFixed(1)+' m deep':'Above water'} · ${animating?'Live movement':'Paused preview'}`;
  // Read-only diagnostics allow native browser QA without injected app actions.
  status.dataset.render=JSON.stringify({time:scene.clock,calls:scene.renderer.info.render.calls,triangles:scene.renderer.info.render.triangles,
    surfaces:'original sand and stone',fog:scene.scene.fog.density,lamp:scene.diveLight.intensity,
    textures:scene.renderer.info.memory.textures,pixels:scene.renderer.domElement.width*scene.renderer.domElement.height});
}
function viewpoint(){
  hike=null;hikeMessage='';
  const v=views[index];Object.assign(world.player,{x:v.x,y:v.y,z:v.forest?getForestHeight(world,v.x,v.y):v.z??getSeabedHeight(v.x,v.y)+v.lift,swimming:!v.forest&&!v.cliff&&!v.surface,underwater:!v.forest&&!v.cliff&&!v.surface});
  const dx=v.target?v.target.x-v.x:0,dy=v.target?v.target.y-v.y:0;
  scene.setLook(v.target?Math.atan2(dx,-dy):v.yaw,v.target?Math.atan2(v.target.z-world.player.z-EYE_HEIGHT,Math.hypot(dx,dy)):v.pitch);
  document.querySelector('#view-name').textContent=v.name;document.querySelector('#climb').hidden=!v.cliff;draw();
}
function stop(){animating=false;cancelAnimationFrame(frame);button.textContent='Animate';button.setAttribute('aria-pressed','false');if(scene&&world)draw();}
function stepHike(){
  if(!hike)return;
  const target=hike.points[hike.index],player=world.player,dx=target.x-player.x,dy=target.y-player.y,distance=Math.hypot(dx,dy);
  const support=getOrangeCliffSurface(player.x,player.y,world.borders);
  const grounded=!player.swimming&&!player.jumping&&!player.falling&&support&&Math.abs(player.z-support.z)<1;
  if(distance<6&&Math.abs(player.z-target.z)<=8&&grounded){
    if(++hike.index===hike.points.length){hike=null;hikeMessage='Reached the lower lookout · the upper rim is too steep to climb';stop();return;}
    return;
  }
  if(distance>1e-6)scene.setLook(Math.atan2(dx,-dy),Math.atan2(target.z-player.z,Math.max(100,distance)));
  updateWorld(world,{x:distance>1e-6?dx/distance:0,y:distance>1e-6?dy/distance:0,ascend:true},1/30);
  hike.ticks++;
  hike.blocked=Math.hypot(player.x-hike.previous.x,player.y-hike.previous.y)<.01?hike.blocked+1:0;
  hike.previous={x:player.x,y:player.y};
  hikeMessage=`Climbing · ${(Math.max(0,player.z-route.foot.z)/25).toFixed(1)} m above the first ledge`;
  if(hike.blocked>90||hike.ticks>1800){hike=null;hikeMessage='Climb paused · the next ledge could not be reached';stop();}
}
function loop(now){if(!animating||document.hidden)return;if(now-last>=1000/15){last=now;time+=1/15;stepHike();stepHike();world.elapsed=time;draw(1/15);}if(animating)frame=requestAnimationFrame(loop);}
document.querySelector('#next').onclick=()=>{index=(index+1)%views.length;viewpoint();};
button.onclick=()=>{if(animating){stop();return;}animating=true;button.textContent='Pause';button.setAttribute('aria-pressed','true');last=0;frame=requestAnimationFrame(loop);};
document.querySelector('#climb').onclick=()=>{
  if(!route)return;stop();world=createWorld();time=world.elapsed;
  const length=Math.hypot(route.foot.x-route.lookout.x,route.foot.y-route.lookout.y)||1;
  const approach=route.approach??{x:route.foot.x+(route.foot.x-route.lookout.x)/length*20,y:route.foot.y+(route.foot.y-route.lookout.y)/length*20,z:SURFACE_FEET};
  Object.assign(world.player,approach,{swimming:true,underwater:false});
  hike={points:[route.foot,...route.path,route.lookout],index:0,ticks:0,blocked:0,previous:{x:world.player.x,y:world.player.y}};hikeMessage='Approaching the first climbing ledge';
  document.querySelector('#view-name').textContent='Orange cliffs · walking the real climbing route';
  button.onclick();
};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();});
window.addEventListener('resize',()=>{if(scene&&world){scene.resize();draw();}});
window.addEventListener('pagehide',()=>{stop();scene?.dispose();},{once:true});
try{world=createWorld();scene=new Scene(document.querySelector('#world'),{onInvalidate:()=>{if(scene&&world&&!animating&&!document.hidden)draw();}});scene.setRenderDistance(80);viewpoint();}
catch(error){status.textContent='The preview could not start.';document.querySelector('#error').textContent=error.message;console.error('Croba underwater preview:',error);}
</script></body></html>
